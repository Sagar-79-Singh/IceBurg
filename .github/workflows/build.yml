name: Build

# Pushing a tag such as v0.1.0 builds the installers and publishes them to
# Releases. The workflow can also be run by hand to get them as downloadable
# artifacts without a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-latest
            label: Windows .exe
            flag: --win
          - os: ubuntu-22.04
            label: Linux AppImage
            flag: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci || (sleep 20 && npm ci)

      - name: Run checks
        run: npm run check

      - name: Build renderer
        run: npm run build

      - name: Package installer
        id: package
        continue-on-error: true
        shell: bash
        env:
          # macOS builds are unsigned: no certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.flag }} --publish never 2>&1 | tee "$RUNNER_TEMP/builder.log"

      # A failed packaging step is reported twice: as an annotation that says what
      # the builder said, and as a failed job.
      - name: Confirm an installer was produced
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::electron-builder failed on ${{ matrix.os }}"
          tail -n 20 "$RUNNER_TEMP/builder.log" | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error
          retention-days: 14


  # macOS runners are capacity limited and can sit in the queue for a long time.
  # Keeping this job separate means its queue never delays the release below.
  package-macos:
    name: macOS .dmg
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || (sleep 20 && npm ci)
      - run: npm run check
      - run: npm run build
      - name: Package
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  # Runs by hand from the Actions tab. Electron on Linux can build the Windows
  # installer with its bundled wine, so one machine produces every artifact
  # without waiting on three different runners.
  package-one:
    name: Build every installer
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package for Windows, Linux and macOS
        run: npx electron-builder --win --linux --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error

  release:
    name: Publish to Releases
    # Runs even when a platform could not be built, so a queued macOS runner does
    # not hold back the Windows and Linux installers.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: package
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: installers
          merge-multiple: true

      - name: List what was built
        run: ls -la installers || echo "No installers were produced"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: IceBurg ${{ github.ref_name }}
          files: installers/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ### Downloads

            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64), installer | `IceBurg-*-win-x64.exe` |
            | Windows (x64), portable, no install | `IceBurg-*-win-x64-portable.exe` |
            | Linux (x64), run anywhere | `IceBurg-*-linux-x86_64.AppImage` |
            | Debian / Ubuntu (x64), installs via dpkg | `IceBurg-*-linux-*.deb` |
            | macOS (Intel and Apple silicon) | `IceBurg-*-mac-*.dmg` |

            The `.deb` installs with `sudo apt install ./IceBurg-*.deb` (or `sudo dpkg -i IceBurg-*.deb`).
            The portable `.exe` runs as-is, with no installer and no admin rights.

            The macOS build is unsigned, so the first launch needs a right-click on the app
            and then Open. The Linux AppImage only needs `chmod +x` before you run it.

            IceBurg looks for Ollama on first launch and asks before installing anything.
            Cloud providers need an API key, added in settings.

  release-macos:
    name: Add the macOS dmg to the release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: package-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download dmg
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: installers

      - name: Note whether a dmg arrived
        run: |
          ls -la installers || echo "No macOS installer in this run"
          if ! ls installers/*.dmg 2>/dev/null; then
            echo "::warning::The macOS job did not produce a dmg in this run. Re-run the Build workflow to add it."
          fi

      - name: Attach it
        if: steps.fetch.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*.dmg
          fail_on_unmatched_files: false
          body: |
            ### Downloads

            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64), installer | `IceBurg-*-win-x64.exe` |
            | Windows (x64), portable, no install | `IceBurg-*-win-x64-portable.exe` |
            | Linux (x64), run anywhere | `IceBurg-*-linux-x86_64.AppImage` |
            | Debian / Ubuntu (x64), installs via dpkg | `IceBurg-*-linux-*.deb` |
            | macOS (Intel and Apple silicon) | `IceBurg-*-mac-*.dmg` |

            The `.deb` installs with `sudo apt install ./IceBurg-*.deb` (or `sudo dpkg -i IceBurg-*.deb`).
            The portable `.exe` runs as-is, with no installer and no admin rights.

            The macOS build is unsigned, so the first launch needs a right-click on the app
            and then Open. The Linux AppImage only needs `chmod +x` before you run it.

            IceBurg looks for Ollama on first launch and asks before installing anything.
            Cloud providers need an API key, added in settings.
